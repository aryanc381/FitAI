<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitAI - Real-time Rep Counter</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }

    img {
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 640px;
      height: 480px;
      object-fit: cover;
    }

    p {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #555;
    }

    /* Button Styling */
    .btn {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: 600;
      background-color: #0071e3;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>
  <h1>💪 FitAI - Real-time Rep Counter</h1>
  <img src="{{ url_for('video_feed') }}" alt="Live Video Stream">
  <p>Track your reps using real-time pose detection!</p>
  <button class="btn" onclick="window.location.reload();">Refresh Feed</button>
</body>
</html>
